server {
    listen 80;
    server_name _;

    location /docs {
        proxy_pass http://backend-service:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /redoc {
        proxy_pass http://backend-service:8000/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend-service:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /docs/oauth2-redirect {
        proxy_pass http://backend-service:8000/docs/oauth2-redirect;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}