apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-catalog-deployment
  labels:
    app: backend-catalog
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-catalog
  template:
    metadata:
      labels:
        app: backend-catalog
    spec:
      containers:
        - name: backend-catalog
          image: my-fastapi-catalog:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DB_PATH
              value: /data/test.db
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: db-volume
              mountPath: /data
      volumes:
        - name: db-volume
          hostPath:
            path: /tmp/fastapi-db
            type: DirectoryOrCreate