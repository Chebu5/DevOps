apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        # ===== Catalog: users + products =====
        location /api/users/ {
            proxy_pass http://backend-catalog-service:8000/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/products/ {
            proxy_pass http://backend-catalog-service:8000/products/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ===== Order: orders + stats =====
        location /api/orders/ {
            proxy_pass http://backend-order-service:8000/orders/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/stats {
            proxy_pass http://backend-order-service:8000/stats;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ===== Swagger и OpenAPI =====
        # Swagger живёт на catalog-сервисе (там /docs и /openapi.json).
        # Но у order-сервиса тоже есть свой /docs — если хотите оба,
        # сделайте отдельный префикс, например /order-docs.
        location /docs {
            proxy_pass http://backend-catalog-service:8000/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://backend-catalog-service:8000/openapi.json;
            proxy_set_header Host $host;
        }

        # Опционально: отдельный Swagger для order-сервиса
        location /order-docs {
            proxy_pass http://backend-order-service:8000/docs;
            proxy_set_header Host $host;
        }
        location /order-openapi.json {
            proxy_pass http://backend-order-service:8000/openapi.json;
            proxy_set_header Host $host;
        }

        # ===== Health =====
        location /api/health {
            proxy_pass http://backend-order-service:8000/health;
            proxy_set_header Host $host;
        }

        # ===== Статика фронтенда =====
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }